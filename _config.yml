# Site settings. GitHub Pages reads this and builds the site on every push.
# The text of the site lives in markdown files — see README.md for where.

title: Harald Kugler
# Shown under your name in Google results and in link previews.
description: PhD student in statistics at the University of Copenhagen, working on causal discovery in the Copenhagen Causality Lab.
url: "https://h-kugler.github.io"
baseurl: ""

# Generates /sitemap.xml and /robots.txt so search engines find every page.
plugins:
  - jekyll-sitemap

# Google Search Console ownership check: paste the code from the
# "HTML tag" method here (just the content="…" value), then push.
# google_site_verification: PASTE-CODE-HERE

# Blog posts land at /blog/<title>/. The date comes from the filename.
permalink: /blog/:title/

# One markdown file per paper/project in _research/. They're listed on the
# homepage only; they don't get pages of their own.
collections:
  research:
    output: false

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - README.md
